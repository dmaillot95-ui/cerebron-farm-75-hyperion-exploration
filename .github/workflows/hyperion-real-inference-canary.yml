name: HYPERION Real Inference Canary
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hyperion-real-inference-canary.yml'
permissions:
  contents: read
jobs:
  inference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime
        run: pip install --quiet "transformers>=4.53,<5" accelerate safetensors sentencepiece
      - name: Execute real HYPERION inference
        env:
          MODEL_ID: HuggingFaceTB/SmolLM3-3B
          REVISION: a07cc9a04f16550a088caea529712d1d335b0ac1
        shell: bash
        run: |
          mkdir -p out
          python - <<'PY'
          import os,json,hashlib,time
          from pathlib import Path
          import torch
          from transformers import AutoTokenizer,AutoModelForCausalLM
          mid,rev=os.environ["MODEL_ID"],os.environ["REVISION"]
          q="A system has one proposed engineering solution. Generate two materially different alternatives, state one hidden assumption in each, and name the evidence needed to discriminate among them. Do not declare a winner."
          system="You are HYPERION, CEREBRON's exploration and discovery AI. Expand the solution space, expose hidden assumptions, and separate candidates from facts. Never claim validation without evidence."
          t=time.time()
          tok=AutoTokenizer.from_pretrained(mid,revision=rev)
          mdl=AutoModelForCausalLM.from_pretrained(mid,revision=rev,torch_dtype=torch.float32,low_cpu_mem_usage=True)
          if getattr(tok,"chat_template",None):
            prompt=tok.apply_chat_template([{"role":"system","content":system},{"role":"user","content":q}],tokenize=False,add_generation_prompt=True,enable_thinking=False)
          else:
            prompt=system+"\nUSER: "+q+"\nHYPERION:"
          x=tok(prompt,return_tensors="pt")
          with torch.no_grad():
            y=mdl.generate(input_ids=x["input_ids"],attention_mask=x.get("attention_mask"),max_new_tokens=256,do_sample=False,pad_token_id=tok.eos_token_id)
          ans=tok.decode(y[0][x["input_ids"].shape[1]:],skip_special_tokens=True).strip()
          tainted="<think>" in ans.lower()
          r={"schema":"cerebron-hyperion-real-inference-v1","identity":"HYPERION","farm_id":75,"model_id":mid,"revision":rev,
             "question_sha256":hashlib.sha256(q.encode()).hexdigest(),"answer":ans,"answer_sha256":hashlib.sha256(ans.encode()).hexdigest(),
             "latency_ms":round((time.time()-t)*1000),"execution":"REAL_MODEL_INFERENCE","tainted_internal_reasoning":tainted,
             "claim_scope":"real base-model inference under HYPERION policy; not evidence of independent trained weights or learning"}
          Path("out/hyperion-inference.json").write_text(json.dumps(r,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps({k:r[k] for k in ["identity","model_id","revision","execution","tainted_internal_reasoning","answer_sha256"]}))
          if not ans or tainted: raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyperion-real-inference
          path: out/hyperion-inference.json
          retention-days: 14
